    <style>
        .gun-range-card {
            border: 1px solid #aeb8c2;
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.08);
        }

        .gun-range-card .card-header {
            background: linear-gradient(180deg, #203a53, #101d29);
            color: #fff;
            font-weight: 700;
        }

        .gun-range-label {
            font-weight: 700;
        }

        .gun-range-number {
            color: #0d6efd;
            margin-right: 0.35rem;
        }

        .gun-range-result {
            height: 100%;
            padding: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.35rem;
            background: #f8f9fa;
        }

        .gun-range-result-label {
            display: block;
            margin-bottom: 0.35rem;
            color: #5f6b76;
            font-size: 0.875rem;
        }

        .gun-range-result output {
            color: #14283b;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .gun-range-chart-wrap {
            min-height: 380px;
            padding: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.35rem;
            background: #101b27;
        }

        #gun-range-chart {
            display: block;
            width: 100%;
            height: 340px;
        }

        .gun-range-table-wrap {
            max-height: 380px;
            overflow: auto;
            border: 1px solid #ced4da;
            border-radius: 0.35rem;
        }

        .gun-range-table-wrap thead th {
            position: sticky;
            top: 0;
            z-index: 1;
        }

        #gun-range-status {
            min-height: 1.5rem;
        }

        [hidden] {
            display: none !important;
        }
    </style>

            <i class="fas fa-bars"></i>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-light" id="sidenavAccordion"></nav>
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-3 py-3">
                    <h1 class="mt-2"><i class="fa-solid fa-bullseye"></i> Navyfield Gun Range Simulator</h1>
                    <p id="gun-range-subtitle" class="text-muted">
                        서버와 국가를 고른 뒤 11인치 이상 함포 및 대응 포탄을 선택하세요.
                    </p>

                    <section class="card gun-range-card mb-3">
                        <div id="gun-range-input-title" class="card-header">함포 및 포탄 선택</div>
                        <div class="card-body">
                            <form id="gun-range-form" class="row g-3">
                                <div class="col-12 col-lg-6">
                                    <label for="gun-range-server" class="form-label gun-range-label">
                                        <span class="gun-range-number">1.</span><span id="gun-range-server-label">서버</span>
                                    </label>
                                    <select id="gun-range-server" class="form-select" required>
                                        <option value="korea">Korea server</option>
                                        <option value="global">Global server</option>
                                    </select>
                                </div>
                                <div class="col-12 col-lg-6">
                                    <label for="gun-range-country" class="form-label gun-range-label">
                                        <span class="gun-range-number">2.</span><span id="gun-range-country-label">국가</span>
                                    </label>
                                    <select id="gun-range-country" class="form-select" required disabled>
                                        <option value="">국가를 선택하세요</option>
                                    </select>
                                </div>
                                <div class="col-12 col-lg-6">
                                    <label for="gun-range-gun" class="form-label gun-range-label">
                                        <span class="gun-range-number">3.</span><span id="gun-range-gun-label">11인치 이상 함포</span>
                                    </label>
                                    <select id="gun-range-gun" class="form-select" required disabled>
                                        <option value="">함포를 선택하세요</option>
                                    </select>
                                </div>
                                <div class="col-12 col-lg-6">
                                    <label for="gun-range-projectile" class="form-label gun-range-label">
                                        <span class="gun-range-number">4.</span><span id="gun-range-projectile-label">대응 포탄</span>
                                    </label>
                                    <select id="gun-range-projectile" class="form-select" required disabled>
                                        <option value="">포탄을 선택하세요</option>
                                    </select>
                                </div>
                                <div class="col-12 d-grid">
                                    <button id="gun-range-calculate" class="btn btn-primary" type="submit" disabled>
                                        사거리 계산
                                    </button>
                                </div>
                            </form>
                        </div>
                    </section>

                    <div id="gun-range-status" class="alert alert-secondary py-2" role="status">
                        함포 카탈로그를 불러오는 중…
                    </div>

                    <section id="gun-range-results" class="card gun-range-card mb-3" aria-live="polite" hidden>
                        <div id="gun-range-result-title" class="card-header">계산 결과</div>
                        <div class="card-body">
                            <p id="gun-range-selection-summary" class="text-muted"></p>
                            <div class="row g-3">
                                <div class="col-12">
                                    <div class="gun-range-result">
                                        <span id="gun-range-ui-label" class="gun-range-result-label">쉽야드 사거리</span>
                                        <output id="gun-range-ui"></output>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </main>

            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; g_dori</div>
                    </div>
                </div>
